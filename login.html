      }

      }

      }

        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #999;
        border-radius: 5px;
      }

      .form-container button {
        padding: 12px;
        background: #333;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .form-container button:hover {
        background: #ff6600;
      }

      .form-container img {
        width: 100%;
        border-radius: 10px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        margin-bottom: 20px;
      }

      .form-container img:hover {
