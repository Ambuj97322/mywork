<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Login to Wahaan for vehicle services, buying, selling, and support." />
    <title>Login | Wahaan</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      :root {
        --panel-bg: rgba(196, 193, 193, 0.9);
        --panel-shadow: rgba(0, 0, 0, 0.15);
      }

      body {
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: transparent;
      }

      #background-video {
        position: fixed;
        right: 0;
        bottom: 0;
        min-width: 100%;
        min-height: 100%;
        z-index: -1;
        object-fit: cover;
        filter: blur(6px);
      }

      .form-panel {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 400px;
        padding: 30px;
        background: var(--panel-bg);
        border-radius: 10px;
        box-shadow: 50px 40px 20px var(--panel-shadow);
        z-index: 1;
      }

      .form-panel h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      .form-panel form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .form-panel label {
        font-weight: 600;
        color: #111;
      }

      .form-panel input {
        width: 100%;
        padding: 10px;
        border: 1px solid #999;
        border-radius: 5px;
        color: #000;
        background-color: #fff;
      }

      .form-panel button {
        padding: 12px;
        background: #333;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        width: 100%;
      }

      .form-panel button:hover {
        background: #ff6600;
      }

      .form-panel p {
        margin: 0;
        text-align: center;
        color: #000;
      }

      .form-panel a {
        color: #000;
        text-decoration: underline;
      }

      .chat-button {
        position: fixed;
        bottom: 20px;
        right: 20px;
        z-index: 2;
        background: #333;
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
        cursor: pointer;
      }

      .chat-button i {
        margin-right: 8px;
      }

      @media (max-width: 576px) {
        .form-panel {
          padding: 20px;
          margin: 0 10px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Fullscreen background video -->
    <video autoplay muted loop id="background-video" playsinline aria-hidden="true">
      <source src="videos/High Speed Drifting (Chase Car Cuts II).mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm" data-aos="fade-down">
      <div class="container-fluid">
        <a class="navbar-brand" href="index.html"><i class="fas fa-earth-europe"></i> Wahaan</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNavDropdown"
          aria-controls="navbarNavDropdown"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNavDropdown">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Services
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="sell.html">Sell your Wahaan</a></li>
                <li><a class="dropdown-item" href="buy.html">Buy a Wahaan</a></li>
                <li><a class="dropdown-item" href="repairs.html">Repairs &amp; Maintenance</a></li>
                <li><a class="dropdown-item" href="modification.html">Custom Modification</a></li>
              </ul>
            </li>
            <li class="nav-item dropdown">
              <a
                class="nav-link dropdown-toggle"
                href="#"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Vehicles
              </a>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="bikes.html">Bike</a></li>
                <li><a class="dropdown-item" href="cars.html">Car</a></li>
                <li><a class="dropdown-item" href="ev.html">EV</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact Us</a>
            </li>
            <li class="nav-item">
              <a class="btn btn-outline-primary" href="login.html">Login / Sign Up <i class="fas fa-user"></i></a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main login section -->
    <main class="d-flex justify-content-center align-items-center" style="min-height: 95vh;">
      <section class="form-panel" aria-labelledby="login-heading">
        <h2 id="login-heading">Login to Wahaan</h2>
        <form>
          <div>
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              required
              autocomplete="username"
            />
          </div>
          <div>
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
          </div>
          <button type="submit">Login</button>
        </form>
        <p>
          Don't have an account? <a href="signup.html">Sign up here</a>
        </p>
      </section>
    </main>

    <!-- Floating chat support button -->
    <button type="button" class="chat-button" aria-label="Chat support">
      <i class="fas fa-headset"></i> Chat Support
    </button>

    <!-- Page footer -->
    <footer class="bg-dark text-light pt-3 pb-3">
      <div class="container text-center">Wahaan. Developed by Asur</div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
      AOS.init();

      document.addEventListener('DOMContentLoaded', function () {
        var chatButton = document.querySelector('.chat-button');
        if (chatButton) {
          chatButton.addEventListener('click', function () {
            alert('Chat support is currently unavailable.');
          });
        }
      });
    </script>
  </body>
</html>
